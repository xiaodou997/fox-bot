[workspace]
members = ["crates/foxbot-core", "crates/foxbot-sim", "crates/foxbot-http", "crates/foxbot-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
foxbot-core = { path = "crates/foxbot-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
zeroize = "1.8"
getrandom = "0.4"
